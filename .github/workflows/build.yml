name: Build Tarot Practice Lab
on:
  push:
    branches: [remake/tarot-practice-lab]
  pull_request:
    branches: [remake/tarot-practice-lab]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
